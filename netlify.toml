[build]
publish = "public"
command = 'hugo version; hugo mod get || exit $?; attempts=0; until hugo --minify; do attempts=$((attempts + 1)); if [ "$attempts" -ge 10 ]; then exit 1; fi; printf "\n\n------------\nRETRYING (%s/10)\n--------\n\n" "$attempts"; done; cp _redirects public/'

[build.environment]
HUGO_VERSION = "0.106.0"
TZ = "Europe/Warsaw"

[context.deploy-preview]
command = 'hugo version; hugo mod get || exit $?; attempts=0; until hugo --minify -b "$DEPLOY_PRIME_URL"; do attempts=$((attempts + 1)); if [ "$attempts" -ge 10 ]; then exit 1; fi; printf "\n\n------------\nRETRYING (%s/10)\n--------\n\n" "$attempts"; done; cp _redirects public/'

[functions]
node_bundler = "esbuild"

[[headers]]
for = "/directory/*"
[headers.values]
access-control-allow-origin = "*"
access-control-allow-headers = "*"
